name: Database

on:
  pull_request:
    paths:
      - "supabase/**"
      - "tests/db/**"
      - "scripts/verify-db.sh"
      - ".github/workflows/database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "tests/db/**"
      - "scripts/verify-db.sh"
      - ".github/workflows/database.yml"

jobs:
  verify:
    name: Migrations + tests (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Supabase runs Postgres 15 and 17. The schema needs 15+
        # (ON DELETE SET NULL (column) syntax).
        postgres: ["15", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run database tests
        run: scripts/verify-db.sh
